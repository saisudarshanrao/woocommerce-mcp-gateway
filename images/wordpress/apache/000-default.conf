<VirtualHost *:8080>
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Probes arrive every few seconds; keep them out of the access log.
    SetEnvIf User-Agent "^kube-probe/" probe
    SetEnvIf Request_URI "^/healthz$" probe
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!probe
</VirtualHost>
