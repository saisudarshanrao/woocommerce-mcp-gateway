ServerName localhost
ServerTokens Prod
ServerSignature Off

# Each prefork worker holds a full PHP interpreter, roughly 60-100 MB with
# WooCommerce loaded, so this cap is what keeps the pod under its memory limit.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       10
    MaxConnectionsPerChild  500
</IfModule>

# Liveness endpoint answered by Apache alone: no PHP, no database.
Alias /healthz /usr/local/share/store-health/healthz
<Directory /usr/local/share/store-health>
    Require all granted
</Directory>
