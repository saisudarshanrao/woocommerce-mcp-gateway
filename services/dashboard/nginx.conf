# Serves the built dashboard. It is static files only: every piece of data the
# pages show comes from the gateway API, which the browser calls on the same
# hostname and which the Ingress routes to a different Service.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Nothing here loads from anywhere but this origin, and the page cannot be framed.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Built files have a hash of their content in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a page of the single-page app: serve it and let the
    # router in the browser decide what to show. Never cache it, so a new
    # release is picked up on the next load.
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
