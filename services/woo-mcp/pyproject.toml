[project]
name = "woo-mcp"
version = "0.1.0"
description = "MCP server that exposes a WooCommerce store's products and orders as tools"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
    # Also what the MCP SDK itself uses, so there is one HTTP stack.
    "httpx2>=2.13,<3",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
