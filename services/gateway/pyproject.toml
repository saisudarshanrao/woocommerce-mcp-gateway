[project]
name = "gateway"
version = "0.1.0"
description = "Team MCP gateway: one MCP endpoint in front of many MCP servers, with users, API keys and an audit log"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.13,<3",
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "asyncpg>=0.32",
    "argon2-cffi>=25.1",
    "cryptography>=50",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "gateway/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
