# Production-like VPS (k3s). Applied on top of values.yaml.
#
# Change the hostname, the admin email and the image registry before use. TLS
# expects cert-manager with a ClusterIssuer of the name given below.

host: gateway.example.com

admin:
  email: admin@example.com

ingress:
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true

seedServers:
  - slug: woo
    name: WooCommerce store
    url: http://store-woo-mcp.store-main.svc.cluster.local/mcp
    auth_type: bearer
    credentialFrom:
      namespace: store-main
      name: store-secrets
      key: mcp-auth-token

api:
  image:
    registry: ghcr.io/OWNER
  replicas: 2

dashboard:
  image:
    registry: ghcr.io/OWNER

postgres:
  persistence:
    size: 10Gi

# Stores from the dashboard. Point a wildcard DNS record (*.stores.example.com)
# at the server. `make gateway-up` sets the registry and image tags that new
# stores use, to the same ones the first store runs.
provisioner:
  enabled: true
  image:
    registry: ghcr.io/OWNER
  storeValuesFile: values-prod.yaml
  hostTemplate: "{slug}.stores.example.com"
  storeValues:
    quota:
      enabled: true
