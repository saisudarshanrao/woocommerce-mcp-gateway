{{- if .Values.ingress.enabled }}
{{- $fullname := include "gateway.fullname" . }}
# One hostname for everything, so the dashboard and the API share an origin and
# the browser needs no cross-origin permission to call the API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          # To the API: the dashboard's REST API, the MCP endpoint, and the
          # OAuth endpoints an MCP client uses to sign in with a browser. Their
          # paths are fixed by the OAuth and MCP specifications. Everything
          # else, including the consent page, is the dashboard.
          {{- range list "/api" "/mcp" "/.well-known/oauth-authorization-server" "/.well-known/oauth-protected-resource" "/authorize" "/token" "/register" "/revoke" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port:
                  name: http
          {{- end }}
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-dashboard
                port:
                  name: http
          {{- end }}
{{- end }}
