{{- if not .Values.secrets.existingSecret }}
{{- /*
Generated on first install and read back with `lookup` on every upgrade.

Losing or changing encryption-key makes every stored upstream credential
unreadable, and changing postgres-password locks the API out of a database
whose volume was initialised with the old one. So the Secret is also kept on
`helm uninstall`, like the database volume it belongs with.
*/}}
{{- $name := include "gateway.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ get $existing "postgres-password" | default (randAlphaNum 32 | b64enc) | quote }}
  admin-password: {{ get $existing "admin-password" | default (randAlphaNum 24 | b64enc) | quote }}
  encryption-key: {{ get $existing "encryption-key" | default (randAlphaNum 64 | b64enc) | quote }}
---
{{- end }}
{{- /*
The seed list, with each credential copied in from the Secret it names. It is
a Secret rather than a ConfigMap because of those credentials.
*/}}
{{- $servers := list }}
{{- range .Values.seedServers }}
{{- $entry := omit . "credentialFrom" }}
{{- with .credentialFrom }}
{{- $source := lookup "v1" "Secret" .namespace .name }}
{{- if and $source (hasKey ($source.data | default dict) .key) }}
{{- $entry = set $entry "credential" (index $source.data .key | b64dec) }}
{{- end }}
{{- end }}
{{- $servers = append $servers $entry }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-seed
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  servers.json: {{ $servers | toJson | quote }}
