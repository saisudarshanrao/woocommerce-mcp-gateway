{{- if not .Values.secrets.existingSecret }}
{{- /*
Every credential the store needs, generated on first install.

`lookup` reads the Secret back from the cluster on each later render, so an
upgrade reuses the existing values instead of rolling new ones. That matters:
MariaDB bakes its passwords into the data volume at first start, so a changed
password here would lock WordPress out of its own database.

The Secret is kept on `helm uninstall` for the same reason: the data volumes
are kept too, and they are only usable with these passwords. Deleting the
namespace removes everything.
*/}}
{{- $name := include "store.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "mariadb-root-password" "mariadb-password" "wp-admin-password" }}
  {{ $key }}: {{ get $existing $key | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
  {{- /* WordPress's eight keys and salts, which sign login cookies and nonces. */}}
  {{- range $key := list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ $key }}: {{ get $existing $key | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
  {{- /* WooCommerce REST API key pair for the MCP server, in WooCommerce's own format. */}}
  wc-consumer-key: {{ get $existing "wc-consumer-key" | default (printf "ck_%s" (randAlphaNum 32 | sha1sum) | b64enc) | quote }}
  wc-consumer-secret: {{ get $existing "wc-consumer-secret" | default (printf "cs_%s" (randAlphaNum 32 | sha1sum) | b64enc) | quote }}
  {{- /* Bearer token a caller must present to the MCP server. The gateway is given a copy. */}}
  mcp-auth-token: {{ get $existing "mcp-auth-token" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
