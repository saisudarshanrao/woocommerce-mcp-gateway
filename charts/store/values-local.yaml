# Local cluster (k3d). Applied on top of values.yaml by `make store-up`, which
# also sets each image tag to the content hash of that image's source directory.

store:
  host: store.localhost
  title: Urumi Store
  timezone: Asia/Kolkata

ingress:
  className: traefik

wordpress:
  image:
    registry: localhost:5001
  resources:
    limits:
      memory: 768Mi
  persistence:
    size: 1Gi

wooMcp:
  image:
    registry: localhost:5001

mariadb:
  innodbBufferPoolSize: 128M
  resources:
    limits:
      memory: 512Mi
  persistence:
    size: 1Gi
